<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduplan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- <header> é uma tag semântica: ela existe especificamente para marcar o cabeçalho do site.
        class="header" conecta esta tag com o css -->
    <header class="header">

        <!-- Essa div é so um "envelope" interno, usado para limitar a largura do conteúdo e organizar os itens com flexbox -->
        <div class="header-inner">
            <a href="#" class="logo">
                <img src="./assets/image.png" alt="logo Eduplan">

                <h2 style="color: #1d4ed8;">Edu <span style="color: #16a34a;">Plan</span></h2>
            </a>

            <ul class="nav" id="nav">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Recursos</a></li>
                <li><a href="#">Benefícios</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Depoimento</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
            
            <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
            </div>
        </div>
    </header>
</body>
</html>
